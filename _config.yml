baseurl: /
url: http://pjevans00.github.io
permalink: pretty
title: 'Full Wild'

logo:
  mobile: "images/logo/logo-black-transparent.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo-black-transparent.svg"
  desktop_height: "128px"
  desktop_width: "128px"

home: 
  limit_services: 6

collections:
  services:
    output: false
    sort_by: weight
  team:
    output: true

defaults:
  - scope:
      path: ""
      type: "Classes"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "Upcoming Events"
    values:
      layout: "team"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
